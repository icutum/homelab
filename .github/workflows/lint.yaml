---
name: lint

on:
  pull_request:
    paths:
      - "**/*.yaml"
  push:
    branches:
      - main
    paths:
      - "**/*.yaml"

permissions: {}

jobs:
  test:
    name: Lint YAML
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Lint YAML
        run: yamllint -s .
