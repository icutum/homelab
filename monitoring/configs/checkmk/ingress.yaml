---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkmk-ingress
  namespace: checkmk
  annotations:
    external-dns.kubernetes.io/hostname: checkmk.local.mariosl.dev
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: cert-manager-cluster-issuer
spec:
  ingressClassName: traefik
  rules:
    - host: checkmk.local.mariosl.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkmk-helmrelease-app
                port:
                  number: 5000
  tls:
    - hosts:
        - checkmk.local.mariosl.dev
      secretName: checkmk-local-mariosl-dev-tls
