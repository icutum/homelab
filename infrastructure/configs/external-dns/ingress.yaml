---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: external-dns-proxmox-ingress
  namespace: external-dns
  annotations:
    external-dns.kubernetes.io/hostname: proxmox.local.mariosl.dev
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    cert-manager.io/cluster-issuer: cert-manager-cluster-issuer
spec:
  ingressClassName: traefik
  rules:
    - host: proxmox.local.mariosl.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: external-dns-proxmox-service
                port:
                  number: 8006
  tls:
    - hosts:
        - proxmox.local.mariosl.dev
      secretName: proxmox-local-mariosl-dev-tls
